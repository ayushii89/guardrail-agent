name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q
      - name: eval harness smoke test (offline, no API spend)
        env:
          GUARDRAIL_OFFLINE: "1"
        run: python -m evals.run_eval
